
name: Build KGS Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract KGS GreenGold source
        run: |
          mkdir -p source
          unzip -o KGS_GreenGold_Theme_Source.zip -d source
          test -f source/kgs-kailashpati-general-store-app-main/app/build.gradle.kts

      - name: Generate Gradle Wrapper
        working-directory: source/kgs-kailashpati-general-store-app-main
        run: gradle wrapper --gradle-version 9.3.1

      - name: Configure KGS Secrets
        working-directory: source/kgs-kailashpati-general-store-app-main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MERCHANT_UPI_VPA: ${{ secrets.MERCHANT_UPI_VPA }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nMERCHANT_UPI_VPA=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$MERCHANT_UPI_VPA" > .env

      - name: Build KGS Debug APK
        working-directory: source/kgs-kailashpati-general-store-app-main
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload KGS APK
        uses: actions/upload-artifact@v4
        with:
          name: KGS-GreenGold-APK
          path: source/kgs-kailashpati-general-store-app-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
