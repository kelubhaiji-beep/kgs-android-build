
name: Build KGS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "KGS_source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract KGS source
        run: |
          test -f KGS_source.zip
          mkdir -p app
          unzip -q KGS_source.zip -d app
          PUBSPEC="$(find app -name pubspec.yaml -type f | head -n 1)"
          test -n "$PUBSPEC"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.kgs.kailashpati --project-name kgs_grocery_app .

      - name: Get packages
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KGS-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          
