name: Build KGS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "KGS_source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract KGS source
        run: |
          mkdir -p source
          unzip -o KGS_source.zip -d source
      - name: Generate Android project
        working-directory: source
        run: flutter create --platforms=android --org com.kgs.kailashpati .
      - name: Get packages
        working-directory: source
        run: flutter pub get
      - name: Build APK
        working-directory: source
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KGS-Android-APK
          path: source/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
